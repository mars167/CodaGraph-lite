// CodaGraph-lite Agent gRPC 服务定义
// 用于 Context Agent 和 Review Agent 的接口定义

syntax = "proto3";

package codagraph_lite;

// ============== 公共消息类型 ==============

// PR 信息
message PRInfo {
  string platform = 1;    // github, gitee, gitlab
  string owner = 2;       // 仓库所有者
  string repo = 3;         // 仓库名称
  string pr_number = 4;    // PR 编号
  string branch = 5;       // PR 分支
  string base_branch = 6;  // 基础分支
  string title = 7;       // PR 标题
  string description = 8;  // PR 描述
}

// 文件变更信息
message FileChange {
  string path = 1;          // 文件路径
  string status = 2;         // added, modified, deleted, renamed
  string content = 3;        // 新文件内容
  string previous_content = 4; // 旧文件内容（用于 diff）
  repeated string lines_added = 5;    // 新增的行号
  repeated string lines_deleted = 6;  // 删除的行号
}

// 代码位置
message CodeLocation {
  string file_path = 1;
  int32 line_number = 2;
  string function_name = 3;
}

// 代码问题/建议
message CodeIssue {
  string severity = 1;      // critical, major, minor, info
  string category = 2;      // security, performance, style, bug, documentation
  string title = 3;
  string description = 4;
  CodeLocation location = 5;
  string suggestion = 6;
  string code_snippet = 7;
}

// ============== Context Agent 服务 ==============

// Context 收集请求
message ContextRequest {
  PRInfo pr_info = 1;
  repeated FileChange files = 2;      // 需要分析的文件
  string repository_path = 3;          // 仓库本地路径
  string git_ai_path = 4;             // git-ai CLI 路径
  int32 max_iterations = 5;            // ReAct 最大迭代次数
}

// Context 收集响应
message ContextResponse {
  bool success = 1;
  string error_message = 2;
  ContextData context = 3;
  repeated string steps_taken = 4;  // 记录 ReAct 步骤用于调试
}

// 上下文数据
message ContextData {
  repeated SymbolDefinition symbols = 1;          // 相关符号定义
  repeated CallGraphEntry call_graph = 2;          // 调用关系
  repeated CodeRelationship relationships = 3;      // 代码关系
  repeated FileSummary file_summaries = 4;       // 文件摘要
  GitContext git_context = 5;                   // Git 上下文
}

// 符号定义（函数、类、变量等）
message SymbolDefinition {
  string name = 1;
  string kind = 2;           // function, class, variable, constant
  string file_path = 3;
  int32 line_number = 4;
  repeated string parameters = 5;
  string return_type = 6;
  string signature = 7;
  repeated string usages = 8;  // 使用此符号的位置
}

// 调用图条目
message CallGraphEntry {
  string caller_file = 1;
  string caller_function = 2;
  string callee_file = 3;
  string callee_function = 4;
  int32 call_count = 5;
}

// 代码关系
message CodeRelationship {
  string type = 1;           // implements, extends, imports, uses
  string from_file = 2;
  string from_symbol = 3;
  string to_file = 4;
  string to_symbol = 5;
}

// 文件摘要
message FileSummary {
  string file_path = 1;
  int32 line_count = 2;
  int32 function_count = 3;
  int32 class_count = 4;
  string language = 5;
  string purpose = 6;          // AI 推断的文件用途
}

// Git 上下文
message GitContext {
  repeated string recent_commits = 1;  // 相关的最近提交
  repeated string related_prs = 2;    // 相关的 PR
  string branch_info = 3;             // 分支信息
}

// ============== Review Agent 服务 ==============

// 代码审查请求
message ReviewRequest {
  PRInfo pr_info = 1;
  repeated FileChange files = 2;
  ContextData context = 3;        // 来自 Context Agent 的上下文
  string llm_provider = 4;       // openai, anthropic, deepseek 等
  string llm_model = 5;
  string llm_api_key = 6;
  bool include_security = 7;       // 是否包含安全检查
  bool include_performance = 8;   // 是否包含性能检查
  bool include_style = 9;         // 是否包含代码风格检查
}

// 代码审查响应
message ReviewResponse {
  bool success = 1;
  string error_message = 2;
  repeated FileReview file_reviews = 3;
  string summary = 4;           // 整体审查摘要
  int32 total_issues = 5;
  int32 critical_count = 6;
  int32 major_count = 7;
  int32 minor_count = 8;
}

// 单文件审查结果
message FileReview {
  string file_path = 1;
  repeated CodeIssue issues = 2;
  repeated Suggestion suggestions = 3;
  FileMetrics metrics = 4;
}

// 代码建议
message Suggestion {
  string title = 1;
  string description = 2;
  string suggestion_code = 3;
  string reason = 4;
  string impact = 5;          // high, medium, low
}

// 文件指标
message FileMetrics {
  int32 complexity = 1;
  int32 lines_of_code = 2;
  int32 lines_with_comments = 3;
  repeated string code_smells = 4;
}

// ============== Context Agent 服务定义 ==============

service ContextAgentService {
  // 收集 PR 上下文信息
  rpc CollectContext(ContextRequest) returns (ContextResponse);

  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ============== Review Agent 服务定义 ==============

service ReviewAgentService {
  // 执行代码审查
  rpc ReviewCode(ReviewRequest) returns (ReviewResponse);

  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ============== 健康检查消息 ==============

message HealthCheckRequest {
  string service = 1;  // context-agent, review-agent
}

message HealthCheckResponse {
  bool healthy = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  string message = 4;
}
