# CodaGraph-lite 日志轮转配置
# 适用于 2u2g 服务器优化
#
# 安装方法:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/codagraph-lite
#
# 测试配置:
#   sudo logrotate -d /etc/logrotate.d/codagraph-lite
#
# 手动执行:
#   sudo logrotate -f /etc/logrotate.d/codagraph-lite

# ============================================
# 前端日志
# ============================================
/opt/codagraph-lite/logs/frontend.log
/opt/codagraph-lite/logs/frontend-out.log
/opt/codagraph-lite/logs/frontend-error.log {
    daily               # 每天轮转
    rotate 14            # 保留最近 14 天
    compress             # 压缩旧日志
    delaycompress        # 延迟压缩，保留最近一天的未压缩日志
    missingok            # 如果日志文件不存在，不报错
    notifempty           # 如果日志为空，不轮转
    size 100M           # 超过 100MB 立即轮转（2u2g 保护）
    create 0640 root adm  # 创建新日志文件的权限和所有者

    # 轮转后的脚本
    sharedscripts
    postrotate
        # 通知前端服务重新打开日志文件
        # systemd
        if systemctl is-active --quiet codagraph-lite-frontend 2>/dev/null; then
            systemctl reload codagraph-lite-frontend >/dev/null 2>&1 || true
        fi
        # PM2
        if command -v pm2 &> /dev/null && pm2 list | grep -q "codagraph-lite-frontend.*online"; then
            pm2 reload codagraph-lite-frontend >/dev/null 2>&1 || true
        fi
    endscript
}

# ============================================
# 后端日志
# ============================================
/opt/codagraph-lite/logs/backend.log
/opt/codagraph-lite/logs/backend-out.log
/opt/codagraph-lite/logs/backend-error.log {
    daily               # 每天轮转
    rotate 14            # 保留最近 14 天
    compress             # 压缩旧日志
    delaycompress        # 延迟压缩
    missingok            # 日志文件不存在时不报错
    notifempty           # 空日志不轮转
    size 100M           # 超过 100MB 立即轮转（2u2g 保护）
    create 0640 root adm  # 新日志文件权限和所有者

    sharedscripts
    postrotate
        # 通知后端服务重新打开日志文件
        if systemctl is-active --quiet codagraph-lite-backend 2>/dev/null; then
            systemctl reload codagraph-lite-backend >/dev/null 2>&1 || true
        fi
        if command -v pm2 &> /dev/null && pm2 list | grep -q "codagraph-lite-backend.*online"; then
            pm2 reload codagraph-lite-backend >/dev/null 2>&1 || true
        fi
    endscript
}

# ============================================
# agent 日志（如果存在）
# ============================================
/opt/codagraph-lite/logs/context-agent.log {
    daily
    rotate 7             # 保留最近 7 天（辅助进程日志不需要保留太久）
    compress
    delaycompress
    missingok
    notifempty
    size 50M            # 较小的限制，agent 日志通常较少
    create 0640 root adm

    sharedscripts
    postrotate
        # 确保日志目录权限正确
        find /opt/codagraph-lite/logs -name "*.gz" -mtime +7 -exec rm -f {} \; 2>/dev/null || true
    endscript
}

# ============================================
# 作业日志（如果存在）
# ============================================
/opt/codagraph-lite/logs/job-*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    maxage 7            # 7 天后自动删除
    create 0640 root adm

    sharedscripts
    postrotate
        # 清理旧的作业日志
        find /opt/codagraph-lite/logs -name "job-*.log" -mtime +7 -exec rm -f {} \; 2>/dev/null || true
    endscript
}

# ============================================
# 系统日志（journalctl 转储到文件）
# ============================================
/var/log/codagraph-lite/*.log {
    weekly              # 每周轮转
    rotate 4            # 保留 4 周
    compress
    missingok
    notifempty
    create 0640 root adm

    sharedscripts
    postrotate
        # 限制系统日志总大小
        find /var/log/codagraph-lite -name "*.gz" -size +100M -delete 2>/dev/null || true
    endscript
}
