name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      skip_tests:
        description: '跳过测试'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # 代码质量检查
  # ============================================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 缓存 Node modules
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖 (Web)
        run: |
          cd web && npm ci

      - name: 安装依赖 (Server)
        run: |
          cd server && npm ci

      - name: ESLint 检查 (Web)
        run: |
          cd web && npm run lint
        continue-on-error: true

      - name: ESLint 检查 (Server)
        run: |
          cd server && npm run lint
        continue-on-error: true

      - name: Prettier 格式检查
        run: |
          npx prettier --check \
            "web/**/*.{ts,tsx,js,jsx,json,css,md}" \
            "server/**/*.{ts,js,json,md}"

  # ============================================
  # 前端构建
  # ============================================
  build-frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 缓存 Next.js 构建输出
        uses: actions/cache@v4
        with:
          path: |
            web/.next/cache
            web/node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**', 'web/app/**', 'web/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 安装依赖
        run: |
          cd web
          npm ci

      - name: 生成构建信息
        id: build-info
        run: |
          cd web
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: 创建 .env.production.local
        env:
          API_URL: ${{ vars.API_URL }}
          SHA: ${{ steps.build-info.outputs.sha }}
          TIMESTAMP: ${{ steps.build-info.outputs.timestamp }}
        run: |
          cd web
          cat > .env.production.local << EOF
          NEXT_PUBLIC_API_URL=${API_URL:-'http://localhost:7900'}
          NEXT_PUBLIC_VERSION=${SHA}
          NEXT_PUBLIC_BUILD_TIME=${TIMESTAMP}
          EOF

      - name: 构建前端
        id: build
        run: |
          cd web
          npm run build || true

      - name: 分析构建产物大小
        run: |
          cd web/.next/static
          du -sh . | sort -hr || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ steps.build-info.outputs.timestamp }}
          path: |
            web/.next
            web/public
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # 后端构建
  # ============================================
  build-backend:
    name: 后端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 缓存 Node modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node-server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-server-

      - name: 安装依赖
        run: |
          cd server
          npm ci

      - name: 生成 TypeScript 类型检查
        run: |
          cd server
          npx tsc --noEmit --pretty || true

      - name: 运行数据库迁移
        run: |
          cd server
          npx prisma generate
          npx prisma migrate validate || true

      - name: 构建后端
        run: |
          cd server
          npm run build

      - name: 运行单元测试
        run: |
          cd server
          npm test -- --maxWorkers=2 || true
        if: ${{ !inputs.skip_tests }}

      - name: 上传测试覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage
          retention-days: 7

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.run_number }}
          path: |
            server/dist
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # 安全扫描
  # ============================================
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-frontend, build-backend]
    if: github.event_name != 'pull_request'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行 npm audit
        run: |
          cd web && npm audit --audit-level=moderate || true
          cd ../server && npm audit --audit-level=moderate || true

      - name: 运行 Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================
  # 部署到生产环境
  # ============================================
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-frontend, build-backend, security-scan]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')

    environment:
      name: production

    steps:
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-*
          path: ./frontend

      - name: 下载后端构建产物
        uses: actions/download-artifact@v4
        with:
          name: backend-build-*
          path: ./backend

      - name: 设置部署密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 创建部署备份点
        id: backup
        run: |
          BACKUP_TAG="backup-$(date +%Y%m%d-%H%M%S)"
          echo "backup_tag=$BACKUP_TAG" >> $GITHUB_OUTPUT

      - name: 部署前端
        run: |
          echo "部署前端到生产环境..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/.next/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/web/.next/

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/public/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/web/public/

      - name: 部署后端
        run: |
          echo "部署后端到生产环境..."
          rsync -avz --exclude node_modules \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./backend/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/server/dist/

      - name: 重启服务
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            cd ${{ secrets.DEPLOY_PATH }}
            pm2 restart codagraph-server || pm2 restart all
            pm2 restart codagraph-web || pm2 restart all
            sleep 30
            pm2 status
          ENDSSH

      - name: 验证部署
        run: |
          API_URL="${{ vars.API_URL || 'http://localhost:7900' }}"
          FRONTEND_URL="${{ vars.FRONTEND_URL || 'http://localhost:3000' }}"

          echo "验证部署..."
          sleep 35
          curl -f -s "$API_URL/api/health" > /dev/null || { echo "API 健康检查失败"; exit 1; }
          curl -f -s -o /dev/null "$FRONTEND_URL" || { echo "前端健康检查失败"; exit 1; }
          echo "部署验证成功！"

      - name: 失败回滚
        if: failure()
        run: |
          echo "部署失败，执行回滚..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && git checkout ${{ steps.backup.outputs.backup_tag }} || true"

          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            cd ${{ secrets.DEPLOY_PATH }}
            pm2 restart all
          ENDSSH

      - name: 创建 Git Tag
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # ============================================
  # 部署到 Staging 环境
  # ============================================
  deploy-staging:
    name: 部署到 Staging 环境
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-frontend, build-backend]
    if: |
      github.ref == 'refs/heads/develop' &&
      github.event_name != 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')

    environment:
      name: staging

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-*'
          path: ./build

      - name: 部署到 Staging
        run: |
          echo "部署到 Staging 环境..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./build/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}-staging/

      - name: 重启 Staging 服务
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }}-staging && pm2 restart all || true"

  # ============================================
  # 部署通知
  # ============================================
  notify:
    name: 部署通知
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()

    steps:
      - name: 发送 Slack 通知
        if: secrets.SLACK_WEBHOOK_URL != ''
        env:
          DEPLOYMENT_STATUS: ${{ needs.deploy-production.result == 'success' && needs.deploy-staging.result == 'success' && 'success' || 'failure' }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
        run: |
          MESSAGE="部署 $DEPLOYMENT_STATUS: $REPO_NAME @ $REF_NAME"
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"$MESSAGE\"}"

      - name: 创建 GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: '${{ github.token }}'
          environment: production

  # ============================================
  # 清理工作
  # ============================================
  cleanup:
    name: 清理构建产物
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging, notify]
    if: always()
    steps:
      - name: 清理旧构建产物
        run: |
          echo "清理超过 7 天的构建产物..."
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '.artifacts[] | select(.created_at < (now - 7 * 24 * 60 * 60 | strftime("%Y-%m-%dT%H:%M:%SZ")) | .id' \
            | xargs -I % sh -c 'gh api repos/${{ github.repository }}/actions/artifacts/% --method DELETE || true' || true
        env:
          GH_TOKEN: ${{ github.token }}
