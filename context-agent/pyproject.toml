[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-agent"
version = "1.0.0"
description = "Context Agent for CodaGraph-lite - 智能代码上下文收集服务"
authors = [
    {name = "CodaGraph-lite Team"}
]
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
# 目标 Python 版本
target-version = "py311"

# 每行最大字符数
line-length = 100

# 选择性启用的规则
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM",  # flake8-simplify
  "S",   # flake8-bandit (安全)
]

# 忽略的规则
ignore = [
  "E501",   # 行长度（由 formatter 处理）
  "B008",   # 函数调用可解包
  "SIM108", # 使用三元操作符（降低可读性）
]

# 排除目录
exclude = [
  ".git",
  "__pycache__",
  "*.egg-info",
  ".venv",
  "venv",
  "dist",
  "build",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # 未使用的导入

# 2u2g 安全相关规则
[tool.ruff.lint.flake8-bandit]
# 检查安全问题
check-typed-exception = true
assert-used = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
